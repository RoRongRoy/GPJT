name: Prototype checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --check public/app.js
      - run: node --check public/world.js
      - run: node --check public/gothic.js
      - run: node --check public/sprites.js
      - run: node --check public/sprite-manifest.js
      - run: node --check public/combat.js
      - run: node tests/combat_effects.cjs
      - run: node tests/field_art.cjs
      - run: node tests/client_navigation.cjs
      - run: python tools/check_docs.py
